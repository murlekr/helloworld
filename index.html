<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f9fc;
        --card: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --accent: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #111827;
          --text: #f9fafb;
          --muted: #9ca3af;
          --accent: #60a5fa;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(circle at 10% 10%, #dbeafe, transparent 45%), var(--bg);
        color: var(--text);
        padding: 1rem;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 0.75rem 0 0;
        font-size: clamp(1rem, 4vw, 1.25rem);
        color: var(--muted);
      }

      .badge {
        margin-top: 1.2rem;
        display: inline-block;
        border: 1px solid color-mix(in oklab, var(--accent), transparent 55%);
        color: var(--accent);
        border-radius: 999px;
        padding: 0.4rem 0.75rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello, World! 👋</h1>
      <p>This app runs in any web browser and on mobile browsers.</p>
      <span class="badge">Responsive Web + Mobile</span>
    </main>
  </body>
</html>
